name: Catch up

# Not a daily cron. This dataset is a historical record that gets refreshed
# every few months, so the default is a button you press. The schedule exists
# only as a reminder, and it opens an issue rather than spending money on its
# own — an unattended run that quietly burns the LLM budget for three months is
# worse than a missed refresh.

on:
  workflow_dispatch:
    inputs:
      since:
        description: "Window start (YYYY-MM-DD). Blank = since the last successful run."
        required: false
        type: string
      extract:
        description: "Run extraction (costs money) or just ingest"
        required: false
        default: true
        type: boolean
      limit:
        description: "Cap items extracted this run"
        required: false
        type: string
  schedule:
    # 03:00 SGT on the 1st of Jan / Apr / Jul / Oct.
    - cron: "0 19 1 1,4,7,10 *"

concurrency:
  # Two catch-ups at once would double-spend. Queue, never overlap.
  group: catch-up
  cancel-in-progress: false

jobs:
  remind:
    name: Open a refresh reminder
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const quarter = new Date().toISOString().slice(0, 7);
            const title = `Quarterly catch-up due (${quarter})`;
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'catch-up',
            });
            if (existing.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title,
              labels: ['catch-up'],
              body: [
                'Time to refresh the record.',
                '',
                'Run **Actions → Catch up → Run workflow**, leaving `since` blank to',
                'continue from the last successful run.',
                '',
                'Afterwards check `tracker status` for sources that have gone quiet —',
                'three empty runs usually means a feed URL moved.',
              ].join('\n'),
            });

  catch-up:
    name: Ingest, backfill and extract
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 330   # archives are rate limited at 10s per origin

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IMAP_USERNAME: ${{ secrets.IMAP_USERNAME }}
      IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
      TRACKER_USER_AGENT: ${{ vars.TRACKER_USER_AGENT }}
      TRACKER_LLM_COST_CEILING_USD_PER_RUN: ${{ vars.TRACKER_LLM_COST_CEILING_USD_PER_RUN || '5.00' }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e .

      - name: Apply migrations
        run: tracker db migrate

      - name: Sync the source register
        run: tracker sources sync

      - name: Catch up
        run: |
          ARGS=""
          if [ -n "${{ inputs.since }}" ]; then ARGS="$ARGS --since ${{ inputs.since }}"; fi
          if [ "${{ inputs.extract }}" != "true" ]; then ARGS="$ARGS --no-extract"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          tracker catch-up $ARGS

      - name: Report
        if: always()
        run: tracker status
