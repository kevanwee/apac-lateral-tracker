# Firm gazetteer.
#
# Two jobs:
#   1. Seeds the `firms` and `firm_aliases` tables, so extraction resolves a
#      firm instead of creating a new row and routing the move to review.
#   2. Lets the rule-based extractor recognise firm names in text that has lost
#      its capitalisation — a headline rebuilt from a URL slug reads
#      "herbert smith freehills appoints nick baker", and without a gazetteer
#      there is nothing to tell a firm from a person.
#
# `aliases` carries what the trade press actually writes: legacy merger names,
# shorthand, verein member entities, and local practising entities. Grow it
# from review queue resolutions — that is what makes the system cheaper and
# more deterministic over time.
#
# type: global | regional | local | boutique | in_house | chambers | government | other
# Note `other` for the Big Four: they compete for partners but are not law
# firms, and typing them `global` corrupts the firm-to-firm flow matrix.

version: 1

