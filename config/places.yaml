  MY: [Malaysia, Kuala Lumpur, Penang, Johor Bahru]
  TH: [Thailand, Bangkok, Phuket]
  VN: [Vietnam, Hanoi, Ho Chi Minh City, Ho Chi Minh, Saigon, Da Nang]
  PH: [Philippines, Manila, Makati, Cebu]
  KH: [Cambodia, Phnom Penh]
  LA: [Laos, Vientiane]
  MM: [Myanmar, Burma, Yangon, Rangoon]
  BN: [Brunei, Bandar Seri Begawan]
  BD: [Bangladesh, Dhaka]
  LK: [Sri Lanka, Colombo]
  PK: [Pakistan, Karachi, Lahore, Islamabad]
  MN: [Mongolia, Ulaanbaatar]

  # --- Middle East -------------------------------------------------------
  AE: [United Arab Emirates, UAE, Dubai, Abu Dhabi]
  SA: [Saudi Arabia, Riyadh, Jeddah, Saudi]
  QA: [Qatar, Doha]

  # --- Europe ------------------------------------------------------------
  GB: [United Kingdom, UK, Britain, London, Manchester, Birmingham, Leeds,
       Bristol, Edinburgh, Glasgow, Belfast, Cardiff, Aberdeen]
  IE: [Ireland, Dublin]
  GI: [Gibraltar]
  DE: [Germany, Frankfurt, Munich, Munchen, Berlin, Hamburg, Dusseldorf,
       Düsseldorf, Cologne, Stuttgart]
  FR: [France, Paris, Lyon, Marseille]
  NL: [Netherlands, Amsterdam, Rotterdam, The Hague]
  BE: [Belgium, Brussels, Antwerp]
  LU: [Luxembourg]
  CH: [Switzerland, Zurich, Geneva, Basel]
  ES: [Spain, Madrid, Barcelona]
  IT: [Italy, Milan, Rome]
  ZA: [South Africa, Johannesburg, Cape Town]

  # --- Americas ----------------------------------------------------------
  US: [United States, USA, US, America, Americas, New York, NYC, Manhattan,
       Los Angeles, LA, Chicago, Washington, Washington DC, Boston,
       San Francisco, Silicon Valley, Palo Alto, Houston, Dallas, Austin,
       Atlanta, Miami, Seattle, Denver, Philadelphia, Delaware, California,
       Texas, Florida, New Jersey, Connecticut]
