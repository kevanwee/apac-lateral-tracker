# Place gazetteer: what an article says -> the jurisdiction code we store.
#
# Trade press writes offices, not ISO codes: "a partner in its Sydney office",
# "joins in Hong Kong", "the firm's New York office". Without this mapping
# office_jurisdiction is null on every record, which makes the depth-market
# filter (SG / HK / AU) useless — and those are the markets this project exists
# to cover.
#
# Every code must exist in the `jurisdictions` table, or the sync fails loudly.
# Adding a market is an entry here plus, if new, a jurisdictions migration.
#
# Ordering matters for ambiguity: longer keys are matched first, so
# "Kansas City" wins over "Kansas" and "Hong Kong" is never read as "Hong".

version: 1

places:
  # --- Singapore ---------------------------------------------------------
  SG: [Singapore]

  # --- Hong Kong / Greater China ----------------------------------------
  HK: [Hong Kong, HK SAR, Hongkong]
  MO: [Macau, Macao]
  CN: [
    Mainland China, China, Shanghai, Beijing, Peking, Shenzhen, Guangzhou,
    Chengdu, Hangzhou, Qingdao, Tianjin, Nanjing, Wuhan, Suzhou,
  ]
  TW: [Taiwan, Taipei]

  # --- Australia ---------------------------------------------------------
  # State codes where the city identifies one, country code otherwise.
  AU-NSW: [Sydney, New South Wales, NSW]
  AU-VIC: [Melbourne, Victoria]
  AU-QLD: [Brisbane, Queensland, Gold Coast, Cairns, Townsville]
  AU-WA:  [Perth, Western Australia]
  AU-SA:  [Adelaide, South Australia]
  AU-ACT: [Canberra, Australian Capital Territory]
  AU-TAS: [Hobart, Tasmania, Launceston]
  AU-NT:  [Darwin, Northern Territory]
  AU: [Australia, Australian, Asia Pacific region]

  NZ: [New Zealand, Auckland, Wellington, Christchurch]

  # --- North Asia --------------------------------------------------------
