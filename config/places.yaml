# Words that look like places but are not jurisdictions we track. Listed so
# the matcher skips them rather than mapping them to something wrong.
not_places:
  - Asia
  - Asia Pacific
  - APAC
  - EMEA
  - Europe
  - Middle East
  - Latin America
  - Global
  - International
  - Worldwide
  - South Asia
  - Southeast Asia
  - North America
