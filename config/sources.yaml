  # ---------------------------------------------------------------------
  # Archive enumeration — historical backfill only
  # ---------------------------------------------------------------------
  # These read sitemaps, which is the index a site publishes for machines.
  # They never fetch an article page. Headlines are rebuilt from URL slugs and
  # are therefore lossy, so every item is headline_only and never
  # auto-accepts. See tracker/sources/sitemap.py.

  - slug: australasian-lawyer-archive
    name: Australasian Lawyer — archive
    base_url: https://www.thelawyermag.com
    access_type: feed
    adapter: sitemap
    reliability_tier: 2
    access_level: headline_only
    jurisdiction_focus: [AU, NZ]
    poll_interval_hours: 2160          # quarterly; this is not a live source
    options:
      # Year-partitioned, so a date window is honoured without reading
      # anything. Verified 2026-09-13: 2019-2026, 850-1400 urls per year.
      year_url_template: https://www.thelawyermag.com/au/sitemaps/articles/{year}
      include_pattern: "/au/"
      max_sitemaps: 12
    # Terms reviewed and article reading enabled. Without this the archive
    # yields headlines only, and this outlet's headlines usually name nobody.
    html_access_reviewed_at: 2026-09-13
    html_access_reviewed_by: kevanwee
    terms_url: https://www.thelawyermag.com/robots.txt
    terms_note: >-
      robots.txt disallows only /au/business-news/, /nz/business-news/,
      /cdn-cgi/ and *__hstc= ; the article paths we read (/au/news/,
      /au/practice-areas/) are permitted, and no Crawl-delay is declared so our
      10s floor applies. The client checks robots per URL, so any disallowed
      article is skipped automatically rather than by our own filtering.

  - slug: global-legal-post-archive
    name: The Global Legal Post — archive
    base_url: https://www.globallegalpost.com
    access_type: feed
    adapter: sitemap
    reliability_tier: 2
    access_level: headline_only
    jurisdiction_focus: [GB, US, SG, HK, AE]
    poll_interval_hours: 2160
    options:
      sitemap_url: https://www.globallegalpost.com/sitemap.xml
      child_pattern: "sitemap-posts"
      include_pattern: "/news/"
      max_sitemaps: 6
    active: false
    blocked_reason: >-
      The origin serves /sitemap.xml to curl but returns 403 to our HTTP client
      with an identical User-Agent, while serving /rss and /robots.txt to both
      (reproduced 2026-09-13). That is a client-fingerprint block on that path,
      and the only way past it is to impersonate a different client — the same
      evasion we refuse for ALB. The live feed source above is unaffected and
      keeps working, so only the archive is lost.
    notes: >-
      If this is ever re-enabled: lastmod is regenerated in bulk — thousands of
      URLs share one timestamp — so the adapter marks published_at estimated
      rather than believing it.

  # ---------------------------------------------------------------------
  # Asia Business Law Journal — the APAC archive
  # ---------------------------------------------------------------------

  - slug: asia-business-law-journal
    name: Asia Business Law Journal
    base_url: https://law.asia
    feed_url: https://law.asia/feed
    access_type: feed
    adapter: feed
    reliability_tier: 2
    access_level: summary
    jurisdiction_focus: [SG, HK, CN, JP, KR, IN, ID, MY, TH, VN, PH, TW, AU]
    poll_interval_hours: 6
    terms_url: https://law.asia/robots.txt
    html_access_reviewed_at: 2026-09-14
    html_access_reviewed_by: kevanwee
    terms_note: >-
      robots.txt declares Crawl-delay: 10 for all agents — exactly our floor —
      and disallows only wp-admin, auth surfaces and internal search. Checked
      2026-09-14.
    notes: >-
      The strongest APAC source found. Hong Kong, Singapore, China, Japan,
      Korea, Indonesia coverage that no other reachable outlet provides.

  - slug: asia-business-law-journal-archive
    name: Asia Business Law Journal — archive
    base_url: https://law.asia
    access_type: feed
    adapter: sitemap
    reliability_tier: 2
    access_level: headline_only
    jurisdiction_focus: [SG, HK, CN, JP, KR, IN, ID, MY, TH, VN, PH, TW, AU]
    poll_interval_hours: 2160
    terms_url: https://law.asia/robots.txt
    html_access_reviewed_at: 2026-09-14
    html_access_reviewed_by: kevanwee
    terms_note: Same robots policy as the live feed. Checked 2026-09-14.
    options:
      sitemap_url: https://law.asia/sitemap_index.xml
      child_pattern: "post-sitemap"
      # English articles sit at the root; /zh-hans/, /ja/, /ko/ and /zh-hant/
      # are translations of the same pieces, so including them would duplicate
      # every record in four languages.
      exclude_pattern: 'law\.asia/(zh-hans|zh-hant|ja|ko)/'
      max_sitemaps: 32
      # This outlet slugs {firm}-{person}-{city} with no verb, so the language
      # gate rejects every item. See gate.evaluate_entity_slug.
      gate_mode: slug_entities
    notes: >-
      32 post-sitemaps, roughly 750 urls each. Slugs name entities rather than
      describing the event, which is why this needs the entity gate and the
      article body: the person is in the article, the firm and city in the URL.

  # ---------------------------------------------------------------------
  # Registered but not collected
  # ---------------------------------------------------------------------
  # Kept here rather than deleted so the reason is on the record and a later
  # licensing conversation has somewhere to land.

  - slug: asian-legal-business
    name: Asian Legal Business (ALB)
    base_url: https://www.legalbusinessonline.com
    feed_url: https://www.legalbusinessonline.com/rss
    access_type: feed
    adapter: feed
    reliability_tier: 2
    access_level: headline_only
    jurisdiction_focus: [SG, HK, CN, JP, KR, IN, MY, ID, TH, VN, PH, AU]
    active: false
    blocked_reason: >-
      The origin returns 403 to our client for every path including
      /robots.txt (checked 2026-09-13). Phase 0 treats an unretrievable
      robots.txt as disallow, and we do not vary the User-Agent to get
      around an edge block. Use the newsletter source below instead, which
      is lawful access ALB grants directly.

  # ---------------------------------------------------------------------
  # Newsletter — lawful access to an outlet that blocks crawlers
  # ---------------------------------------------------------------------

  - slug: alb-newsletter
    name: Asian Legal Business — newsletter
    base_url: https://www.legalbusinessonline.com
    access_type: api
    adapter: imap
    reliability_tier: 2
    access_level: headline_only
    jurisdiction_focus: [SG, HK, CN, JP, KR, IN, MY, ID, TH, VN, PH, AU]
    poll_interval_hours: 168
    active: false          # turn on once the folder exists and creds are set
    options:
      host: imap.gmail.com
      # Create this folder and filter the newsletter into it. The adapter
      # reads only this folder, read-only, and never falls back to INBOX.
      folder: legal-tracker/alb
      from_allowlist:
        - legalbusinessonline.com
        - thomsonreuters.com
      url_pattern: 'legalbusinessonline\.com/'
      max_messages: 2000
    notes: >-
      ALB blocks our crawler, but sends its newsletter to subscribers. Reading
      mail addressed to you is not circumvention. Depth depends entirely on how
      far back your own subscription goes. Headlines come from the newsletter's
      own link text, so they are real rather than reconstructed — but there is
      no article body, hence headline_only.
