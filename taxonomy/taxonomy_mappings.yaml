# Phrases that look like a practice and are not. Matching one yields
# `unclassified` rather than a wrong node — a firm-wide role is not a practice.
not_a_practice:
  - pro bono
  - diversity
  - diversity and inclusion
  - business development
  - knowledge management
  - talent
  - operations
  - innovation
  - transformation
  - wellbeing
  - marketing
  - finance team
  - information technology
