  - {match: mergers and acquisitions, primary: corporate.m_and_a}
  - {match: m&a, primary: corporate.m_and_a}
  - {match: ma, primary: corporate.m_and_a}
  - {match: corporate and m&a, primary: corporate.m_and_a}
  - {match: transactional, primary: corporate.m_and_a}
  - {match: dealmaking, primary: corporate.m_and_a}
  - {match: private equity, primary: corporate.private_equity}
  - {match: buyouts, primary: corporate.private_equity}
  - {match: venture capital, primary: corporate.venture_capital}
  - {match: emerging companies, primary: corporate.venture_capital}
  - {match: startups, primary: corporate.venture_capital}
  - {match: corporate governance, primary: corporate.governance}
