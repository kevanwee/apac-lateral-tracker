# Trade press phrasing -> taxonomy node.
#
# This file is what makes classification deterministic and free. Where a
# phrase here matches the practice text an article actually used, no model is
# invoked at all. The model is reserved for genuinely ambiguous cases, and this
# file is meant to grow from review queue resolutions so the system gets
# cheaper and more deterministic over time.
#
# Matching is longest-phrase-first over a lowercased, punctuation-stripped
# form, so "private equity" wins over "equity" and "capital markets" over
# "capital".
#
# `secondary` is optional and capped at two by the database. Use it where a
# compound phrase genuinely spans two groups — "finance and projects" is
# projects work funded by a finance team, not one or the other.
#
# Every `primary` and `secondary` must be a code in practice_groups.yaml, or
# loading fails. There is no way to name a node that does not exist.

version: 1.0.0
taxonomy_version: 1.0.0

mappings:
