# Gold set — manually verified movement records.
#
# Ground truth for the Phase 7 metrics: extraction precision and recall per
# field, classification accuracy, and review queue load.
#
# ## Read this before using the numbers
#
# The brief asks for 100 verified moves. This file has fewer, and the reason
# matters more than the number: ALB, the primary APAC source, edge-blocks our
# client (see config/sources.yaml), and Australasian Lawyer's RSS carried no
# movement news at all on the day sampled. So the live sample is one firm
# newsroom plus one trade outlet, and that outlet is UK/US-weighted.
#
# Filling the remainder honestly needs one of:
#   - a backfill run over historical feed windows once ingest is wired to the
#     database, which is where most of the remaining records should come from
#   - an ALB licensing conversation
#   - firm newsroom adapters for the rest of the top-100 registry (Phase 2
#     remaining-source work), which is the highest-yield APAC option
#
# Fabricating the other records would make every metric computed from this
# file a lie, so they are not here.
#
# ## Provenance
#
#   live_feed   Read from the outlet's own feed on the date given. The `text`
#               is what our pipeline actually had available.
#   synthetic   Written to cover a reporting pattern the live sample did not
#               contain. Never counted in source-coverage or yield metrics;
#               used only for extraction and dedupe pattern tests. Every one
#               is marked, and `pattern` says what it exercises.
#
# ## Retention
#
# Body text is capped at 25 words per record, the same cap the database puts
# on provenance excerpts. Headlines are stored in full, as they are in
# `raw_items`. This fixture is not a corpus.
#
# ## Expectations
#
# `expect` is what the pipeline should produce **from the text in this file**,
# not what is true in the world. If the text does not name an origin firm,
# from_firm is null even where the real answer is knowable elsewhere. Marking
# it otherwise would train the extractor to guess.

version: 1
sampled_at: 2026-09-13
text_word_cap: 25

records:

