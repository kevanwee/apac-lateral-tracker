  # =====================================================================
  # Item-level ground truth — sampled 2026-09-14, seed 4242
  #
  # Forty gate-passed ITEMS drawn uniformly at random from all 1,639, not
  # forty extractor outputs. The distinction is the whole point: a fixture
  # built from records the extractor produced can only confirm what it
  # already got right, so recall is unmeasurable and precision is inflated
  # by selection. Sampling items puts the misses in the fixture too — and
  # on the corpus these came from, the misses were most of it.
  #
  # Fourteen of the forty report no partner-level move at all. Those are
  # kept, and carry `is_movement: false`, because an evaluation holding
  # only true positives cannot see a false one.
  #
  # Firm names here are the surface the article uses, not the gazetteer's
  # canonical name, because `expect` must be readable out of `text` and
  # nothing else. The evaluator resolves both sides through the gazetteer
  # before comparing, so "Allen & Overy" and "Allen & Overy Shearman"
  # count as agreement.
  # =====================================================================
