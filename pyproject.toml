[project]
name = "apac-lateral-tracker"
version = "0.1.0"
description = "Partner lateral-movement intelligence pipeline for APAC legal markets."
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2",
  "click>=8.1",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
tracker = "tracker.cli:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tracker*"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Pinned explicitly so a ruff upgrade cannot change what CI enforces.
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
